<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urth V13.5 – Church Groups Sphere</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; position: fixed; left: 0; }
  </style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Configuration ─────────────────────────────────────────────────────────────
const SPHERE_R   = 190;
const CARD_W     = 72;
const CARD_H     = 40;   // ~16:9
const BASE_SPEED = 0.14; // rad/s for speed=1 bands

// 8 latitude bands — 4 above, 4 below the equator.
// Equatorial gap (±25°) stays completely clear for a CTA overlay.
// Adjacent bands orbit in opposite directions for visual contrast.
const BANDS = [
  { lat:  25, count: 10, dir: -1, speed: 1.00 },
  { lat:  42, count:  8, dir: +1, speed: 0.85 },
  { lat:  57, count:  6, dir: -1, speed: 0.70 },
  { lat:  70, count:  4, dir: +1, speed: 0.55 },
  { lat: -25, count: 10, dir: +1, speed: 1.00 },
  { lat: -42, count:  8, dir: -1, speed: 0.85 },
  { lat: -57, count:  6, dir: +1, speed: 0.70 },
  { lat: -70, count:  4, dir: -1, speed: 0.55 },
];

// 10 church group photos — cycled twice to fill all 20 atlas slots
const IMAGES = [
  '/images/house-church-1.jpg',
  '/images/house-church-2.jpg',
  '/images/house-church-3.jpg',
  '/images/house-church-4.jpg',
  '/images/house-church.jpg',
  '/images/baptism-1.jpg',
  '/images/dr-lin-baptism.png',
  '/images/imags-archive-3.png',
  '/images/nano-baptism.png',
  '/images/image-14-1.jpeg',
];
const TOTAL_SLOTS = 20;  // 5×4 atlas

// ── Texture atlas (5 cols × 4 rows = 20 slots) ────────────────────────────────
const ATLAS_COLS = 5, ATLAS_ROWS = 4, IMG_W = 320, IMG_H = 180;

const atlasCanvas = document.createElement('canvas');
atlasCanvas.width  = ATLAS_COLS * IMG_W;
atlasCanvas.height = ATLAS_ROWS * IMG_H;
const atx = atlasCanvas.getContext('2d');
atx.fillStyle = '#111';
atx.fillRect(0, 0, atlasCanvas.width, atlasCanvas.height);

const atlas = new THREE.CanvasTexture(atlasCanvas);
atlas.colorSpace = THREE.SRGBColorSpace;
atlas.flipY = false;

// Cover-crop draw — maintains aspect ratio, centers and crops like CSS object-fit:cover
function drawCover(ctx, img, dx, dy, dw, dh) {
  const imgAspect = img.naturalWidth / img.naturalHeight;
  const dstAspect = dw / dh;
  let sx, sy, sw, sh;
  if (imgAspect > dstAspect) {
    // Image wider than slot — crop the sides
    sh = img.naturalHeight;
    sw = sh * dstAspect;
    sx = (img.naturalWidth - sw) / 2;
    sy = 0;
  } else {
    // Image taller than slot — crop top and bottom
    sw = img.naturalWidth;
    sh = sw / dstAspect;
    sx = 0;
    sy = (img.naturalHeight - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

// Load each of the 20 slots (cycles through 10 images twice)
for (let i = 0; i < TOTAL_SLOTS; i++) {
  const src = IMAGES[i % IMAGES.length];
  const col = i % ATLAS_COLS;
  const row = Math.floor(i / ATLAS_COLS);
  const img = new Image();
  img.onload = () => {
    drawCover(atx, img, col * IMG_W, row * IMG_H, IMG_W, IMG_H);
    atlas.needsUpdate = true;
  };
  img.src = src;
}

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── Camera ────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 1, 6000);

const PAD_Y = 36;
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  const hEff = h - 2 * PAD_Y;
  const aspect = w / hEff;
  camera.aspect = aspect;
  const dist = aspect >= 1 ? 430 : Math.min(430 / aspect * 1.05, 900);
  camera.position.set(0, 0, dist);
  camera.updateProjectionMatrix();
  renderer.setSize(w, hEff);
  renderer.domElement.style.top = PAD_Y + 'px';
}
fitCamera();
window.addEventListener('resize', fitCamera);

// ── Card shader ───────────────────────────────────────────────────────────────
const cardVS = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const cardFS = /* glsl */`
  uniform sampler2D uAtlas;
  uniform float     uPhotoIdx;
  uniform float     uReady;
  varying vec2 vUv;

  const float COLS = 5.0;
  const float ROWS = 4.0;

  void main() {
    // Aspect-correct rounded rect SDF for 16:9 card
    const float ASPECT = 16.0 / 9.0;
    vec2  p = vUv * 2.0 - 1.0;
    p.x *= ASPECT;
    float r = 0.20;
    vec2  q = abs(p) - vec2(ASPECT, 1.0) + r;
    float d = length(max(q, 0.0)) - r;

    float tol = 0.025;
    if (d > tol) discard;
    float edge = 1.0 - smoothstep(-tol, tol, d);

    // Atlas sample
    float aCol = mod(uPhotoIdx, COLS);
    float aRow = floor(uPhotoIdx / COLS);
    vec2 uv = vec2(
      (aCol + vUv.x) / COLS,
      (aRow + (1.0 - vUv.y)) / ROWS
    );
    vec4 col = texture2D(uAtlas, uv);

    // Gamma + brightness boost
    col.rgb = pow(col.rgb, vec3(0.55));   // lift shadows/midtones
    col.rgb *= 1.15;                       // overall brightness push
    col.rgb = clamp(col.rgb, 0.0, 1.0);   // prevent blowout

    // Frosted glass border
    float bw     = 0.12;
    float border = step(-bw, d) * (1.0 - step(0.0, d));
    col.rgb = mix(col.rgb, vec3(0.90, 0.95, 1.0), border * 0.18);

    gl_FragColor = vec4(col.rgb, col.a * edge * uReady);
  }
`;

// ── Build 56 cards ────────────────────────────────────────────────────────────
const _proj   = new THREE.Vector3();
const allCards = [];
let globalIdx = 0;

BANDS.forEach(band => {
  band.phase0 = 0;  // deterministic start — no random offset
  for (let j = 0; j < band.count; j++) {
    const uni = {
      uAtlas:    { value: atlas },
      uPhotoIdx: { value: globalIdx % TOTAL_SLOTS },
      uReady:    { value: 0.0 },
    };
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(CARD_W, CARD_H),
      new THREE.ShaderMaterial({
        uniforms:       uni,
        vertexShader:   cardVS,
        fragmentShader: cardFS,
        transparent:    true,
        depthWrite:     false,
      })
    );
    scene.add(mesh);
    allCards.push({ mesh, uni, band, posInBand: j });
    globalIdx++;
  }
});

// Fade cards in on load
allCards.forEach(({ uni }) => {
  const fadeIn = () => {
    uni.uReady.value = Math.min(1.0, uni.uReady.value + 0.018);
    if (uni.uReady.value < 1.0) requestAnimationFrame(fadeIn);
  };
  fadeIn();
});

// ── Animate ───────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  allCards.forEach(({ mesh, band, posInBand }) => {
    const lat_rad = band.lat * Math.PI / 180;
    const cosLat  = Math.cos(lat_rad);
    const sinLat  = Math.sin(lat_rad);

    const phase = band.phase0 + t * BASE_SPEED * band.dir * band.speed;
    const lon   = phase + (posInBand / band.count) * Math.PI * 2;

    const x = SPHERE_R * cosLat * Math.sin(lon);
    const y = SPHERE_R * sinLat;
    const z = SPHERE_R * cosLat * Math.cos(lon);

    mesh.position.set(x, y, z);
    mesh.lookAt(camera.position);

    // Depth-based scale: front 1.20×, back 0.80×
    _proj.set(x, y, z).project(camera);
    const depth = (_proj.z + 1.0) * 0.5;
    mesh.scale.setScalar(THREE.MathUtils.lerp(1.20, 0.80, depth));
  });

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
