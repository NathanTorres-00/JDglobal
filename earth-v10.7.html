const RAY_SPOT_INDICES = [1, 4, 7, 10, 13]; // London, Melbourne, Abuja, Anaheim, Nairobi

// ── Coordinate helper ──────────────────────────────────────────────────────────
function latLonToUnit(lat, lon) {
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = (90 - lon) * Math.PI / 180;
  return new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi) * Math.sin(theta)
  );
}
const LANDING_SPOTS = SPOTS.map(s => latLonToUnit(s.lat, s.lng));

// ── Renderer ───────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── Scene & Camera ─────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 10000); // wider FOV for close-up feel
let orbitRadius = 157.5, orbitAngle = 0;

function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.aspect = aspect;
  // Stay close — scale up slightly on portrait so the globe still fills the frame
  orbitRadius = aspect >= 1 ? 157.5 : Math.min(157.5 / aspect * 0.85, 300);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
fitCamera();
window.addEventListener('resize', fitCamera);

// ── Lighting ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x8ab4d4, 0.18));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(180, 120, 220);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x7ab8e8, 0.22);
fillLight.position.set(-160, 40, -120);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0x51aeea, 0.45);
rimLight.position.set(-60, -40, -240);
scene.add(rimLight);

// ── Globe group (holds sphere, dots, rings, rays — all rotate together) ────────
const globeGroup = new THREE.Group();
globeGroup.rotation.z = -23.4 * Math.PI / 180; // real Earth axial tilt
scene.add(globeGroup);

// ── Globe sphere ───────────────────────────────────────────────────────────────
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R, 64, 64),
  new THREE.MeshPhongMaterial({
    color:     new THREE.Color(0x00558c),
    shininess: 28,
    specular:  new THREE.Color(0x007ccc),
  })
);
globeGroup.add(sphere);

// ── Atmosphere (fresnel glow — world-space, FrontSide) ────────────────────────
// World-space normals + cameraPosition built-in gives correct rim glow.
// FrontSide: we see the outer shell; fresnel makes center transparent, edges glow.
const atmoVS = `
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  void main() {
    vec4 wp      = modelMatrix * vec4(position, 1.0);
    vWorldPos    = wp.xyz;
    vWorldNormal = normalize(mat3(modelMatrix) * normal);
    gl_Position  = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const atmoFS = `
  varying vec3 vWorldNormal;
  varying vec3 vWorldPos;
  void main() {
    vec3  viewDir   = normalize(cameraPosition - vWorldPos);
    float rim       = 1.0 - max(0.0, dot(vWorldNormal, viewDir));
    float intensity = pow(rim, 3.5);
    gl_FragColor    = vec4(0.318, 0.682, 0.918, intensity * 0.7);
  }
`;
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R * 1.18, 32, 32),
  new THREE.ShaderMaterial({
    vertexShader: atmoVS, fragmentShader: atmoFS,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.FrontSide,
  })
);
globeGroup.add(atmo);

// ── Land dots (pre-computed, no runtime work) ──────────────────────────────────
{
  const count = _D.length / 2;
  const pos   = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const lat = _D[i * 2], lng = _D[i * 2 + 1];
    const v   = latLonToUnit(lat, lng).multiplyScalar(GLOBE_R * 1.002);
    pos[i*3]   = v.x;  pos[i*3+1] = v.y;  pos[i*3+2] = v.z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x51aeea, size: 0.9,
    sizeAttenuation: true, transparent: true, opacity: 0.92, depthWrite: false,
  });
  globeGroup.add(new THREE.Points(geo, mat));
}

// ── City rings ─────────────────────────────────────────────────────────────────
const RING_PERIOD  = 1.4;   // seconds
const RING_MAX_R   = 7.0;   // world units (~4° arc at GLOBE_R=100)
const RINGS_PER_CITY = 3;
const _up = new THREE.Vector3(0, 1, 0);

const ringVS = `
  uniform float uScale;
  void main() {
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position * uScale, 1.0);
  }
`;
const ringFS = `
  uniform float uAlpha;
  void main() {
    gl_FragColor = vec4(0.0, 0.486, 0.8, uAlpha);
  }
`;

const rings = [];
SPOTS.forEach((spot, si) => {
  const surfNorm = latLonToUnit(spot.lat, spot.lng);
  const quat     = new THREE.Quaternion().setFromUnitVectors(_up, surfNorm);
  const center   = surfNorm.clone().multiplyScalar(GLOBE_R);

  // Unit circle in XZ plane (normal = Y)
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a)));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);

  for (let r = 0; r < RINGS_PER_CITY; r++) {
    const uni = {
      uScale: { value: 0.01 },
      uAlpha: { value: 0.0 },
    };
    const mat  = new THREE.ShaderMaterial({
      uniforms: uni, vertexShader: ringVS, fragmentShader: ringFS,
      transparent: true, depthWrite: false,
    });
    const line = new THREE.Line(geo, mat);
    line.position.copy(center);
    line.quaternion.copy(quat);
    globeGroup.add(line);
    rings.push({ uni, phase: (r / RINGS_PER_CITY) * RING_PERIOD });
  }
});

// ── Radial glow rays ───────────────────────────────────────────────────────────
const RAY_HEIGHT = 28;
const rayTime    = { value: 0 };

const rayVS = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const rayCoreFS = `
  uniform float uTime;
  uniform float uPhase;
  varying vec2 vUv;
  void main() {
    float pulse = pow(max(0.0, sin(uTime * 0.31 + uPhase)), 3.0);
    if (pulse < 0.005) discard;
    float t    = vUv.y;
    float fade = pow(1.0 - t, 1.4);
    float cx   = vUv.x * 2.0 - 1.0;
    float edge = pow(1.0 - cx * cx, 1.2);
    float wisp = 0.75 + 0.25 * sin(t * 18.0 - uTime * 2.0);
    float alpha = fade * edge * wisp * 0.78 * pulse;
    vec3 col = mix(vec3(0.0, 0.486, 0.8), vec3(0.318, 0.682, 0.918), t);
    gl_FragColor = vec4(col, alpha);
  }
`;
const rayHaloFS = `
  uniform float uTime;
  uniform float uPhase;
  varying vec2 vUv;
  void main() {
    float pulse = pow(max(0.0, sin(uTime * 0.31 + uPhase)), 3.0);
    if (pulse < 0.005) discard;
    float t    = vUv.y;
    float fade = pow(1.0 - t, 1.8);
    float cx   = vUv.x * 2.0 - 1.0;
    float edge = pow(1.0 - cx * cx, 0.65);
    float wisp = 0.8 + 0.2 * sin(t * 10.0 - uTime * 1.4 + 1.2);
    gl_FragColor = vec4(0.0, 0.486, 0.8, fade * edge * wisp * 0.26 * pulse);
  }
`;

RAY_SPOT_INDICES.forEach((idx, i) => {
  const phase = (i / RAY_SPOT_INDICES.length) * Math.PI * 2;
  const uni   = { uTime: rayTime, uPhase: { value: phase } };
  const radial = LANDING_SPOTS[idx].clone();
  const quat   = new THREE.Quaternion().setFromUnitVectors(_up, radial);
  const center = radial.clone().multiplyScalar(GLOBE_R + RAY_HEIGHT * 0.5);

  const coreMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 1.0, RAY_HEIGHT, 12, 6, true),
    new THREE.ShaderMaterial({ uniforms: uni, vertexShader: rayVS, fragmentShader: rayCoreFS,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
  );
  coreMesh.position.copy(center); coreMesh.quaternion.copy(quat);
  globeGroup.add(coreMesh);

  const haloMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 3.5, RAY_HEIGHT * 0.75, 10, 6, true),
    new THREE.ShaderMaterial({ uniforms: uni, vertexShader: rayVS, fragmentShader: rayHaloFS,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
  );
  haloMesh.position.copy(center); haloMesh.quaternion.copy(quat);
  globeGroup.add(haloMesh);
});

// ── Traveler particle system ───────────────────────────────────────────────────
const N_TRAVELERS = 18;
const TRAIL_LEN   = 400;
const DPR         = window.devicePixelRatio;
const HEAD_SZ     = 6.5 * DPR;
const TRAIL_SZ    = 3.0 * DPR;

function geodesicDir(pos, target) {
  return target.clone().addScaledVector(pos, -pos.dot(target)).normalize();
}

const travelers = Array.from({ length: N_TRAVELERS }, () => {
  const srcIdx = Math.floor(Math.random() * LANDING_SPOTS.length);
  let   tgtIdx = srcIdx;
  while (tgtIdx === srcIdx) tgtIdx = Math.floor(Math.random() * LANDING_SPOTS.length);
  const pos   = LANDING_SPOTS[srcIdx].clone();
  const tgt   = LANDING_SPOTS[tgtIdx];
  const angle = Math.acos(Math.min(1, Math.max(-1, pos.dot(tgt))));
  return { pos, dir: geodesicDir(pos, tgt), speed: 0.004 + Math.random() * 0.003,
           trail: [], target: tgtIdx, progress: 0, totalAngle: Math.max(0.01, angle) };
});

const totalPts   = N_TRAVELERS * TRAIL_LEN;
const tPositions = new Float32Array(totalPts * 3);
const tAlphas    = new Float32Array(totalPts);
const tSizes     = new Float32Array(totalPts);

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(tPositions, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(tAlphas,    1).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('aSize',    new THREE.BufferAttribute(tSizes,     1).setUsage(THREE.DynamicDrawUsage));

const travelVS = `
  attribute float aAlpha; attribute float aSize; varying float vAlpha;
  void main() {
    vAlpha = aAlpha;
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize;
    gl_Position  = projectionMatrix * mvPos;
  }
`;
const travelFS = `
  uniform vec3 uColor; varying float vAlpha;
  void main() {
    vec2  cxy = 2.0 * gl_PointCoord - 1.0; float r = dot(cxy, cxy);
    if (r > 1.0) discard;
    float glow = exp(-r * 2.8) + exp(-r * 8.0) * 0.6;
    gl_FragColor = vec4(uColor, vAlpha * glow);
  }
`;
const glowVS = `
  attribute float aAlpha; attribute float aSize; varying float vAlpha;
  void main() {
    vAlpha = aAlpha;
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * 3.5;
    gl_Position  = projectionMatrix * mvPos;
  }
`;
const glowFS = `
  uniform vec3 uColor; varying float vAlpha;
  void main() {
    vec2  cxy = 2.0 * gl_PointCoord - 1.0; float r = dot(cxy, cxy);
    if (r > 1.0) discard;
    gl_FragColor = vec4(uColor, vAlpha * exp(-r * 1.1) * 0.38);
  }
`;

const trailMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0x00e5ff) } },  // electric cyan (was #007ccc dark navy)
  vertexShader: travelVS, fragmentShader: travelFS, transparent: true, depthWrite: false,
});
const glowMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0xd0f4ff) } },  // near-white ice (was #51aeea muted sky)
  vertexShader: glowVS, fragmentShader: glowFS, transparent: true, depthWrite: false,
});

const trailMesh = new THREE.Points(trailGeo, trailMat);
const glowMesh  = new THREE.Points(trailGeo, glowMat);
trailMesh.renderOrder = 2; glowMesh.renderOrder = 1;
// Travelers live in world space so the globe tilt doesn't skew their paths
// Travelers must be in globeGroup (same local space as the dots) so the
// -23.4° axial tilt is applied consistently and travelers actually hit the cities.
globeGroup.add(glowMesh); globeGroup.add(trailMesh);

function updateTravelers() {
  travelers.forEach((t, ti) => {
    const newPos = t.pos.clone().addScaledVector(t.dir, t.speed).normalize();
    const newDir = t.dir.clone().addScaledVector(newPos, -t.dir.dot(newPos)).normalize();
    const targetPos   = LANDING_SPOTS[t.target];
    const distToTarget = newPos.distanceTo(targetPos);
    const toTarget     = geodesicDir(newPos, targetPos);
    const steerFactor  = Math.min(0.92, 0.018 / Math.max(distToTarget, 0.018));
    newDir.lerp(toTarget, steerFactor).normalize();
    newDir.addScaledVector(newPos, -newDir.dot(newPos)).normalize();

    if (distToTarget < 0.025) {
      newPos.copy(targetPos);
      let next = t.target;
      while (next === t.target) next = Math.floor(Math.random() * LANDING_SPOTS.length);
      const newTgt   = LANDING_SPOTS[next];
      const newAngle = Math.acos(Math.min(1, Math.max(-1, newPos.dot(newTgt))));
      t.target = next; t.dir = geodesicDir(newPos, newTgt);
      t.progress = 0;  t.totalAngle = Math.max(0.01, newAngle);
    } else { t.dir = newDir; }

    t.progress      = Math.min(1.0, t.progress + t.speed / t.totalAngle);
    const arcFactor = GLOBE_R * (1.0 + ARC_HEIGHT * Math.sin(t.progress * Math.PI));
    const arcPos    = newPos.clone().multiplyScalar(arcFactor);
    t.pos = newPos;
    t.trail.unshift(arcPos);
    if (t.trail.length > TRAIL_LEN) t.trail.pop();

    const base = ti * TRAIL_LEN;
    for (let i = 0; i < TRAIL_LEN; i++) {
      const bi = (base + i) * 3;
      if (i < t.trail.length) {
        const p = t.trail[i];
        tPositions[bi] = p.x; tPositions[bi+1] = p.y; tPositions[bi+2] = p.z;
        const frac        = 1.0 - i / t.trail.length;
        tAlphas[base + i] = frac * frac;
        tSizes [base + i] = i === 0 ? HEAD_SZ : TRAIL_SZ * frac;
      } else { tAlphas[base+i] = 0; tSizes[base+i] = 0; }
    }
  });
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate   = true;
  trailGeo.attributes.aSize.needsUpdate    = true;
}

// ── Render loop ────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  rayTime.value = now;

  // Animate rings
  rings.forEach(({ uni, phase }) => {
    const t = ((now + phase) % RING_PERIOD) / RING_PERIOD;
    uni.uScale.value = Math.max(0.01, t * RING_MAX_R);
    uni.uAlpha.value = Math.sqrt(1.0 - t) * 0.9;
  });

  orbitAngle += ORBIT_SPEED;
  camera.position.set(
    orbitRadius * Math.sin(orbitAngle),
    ORBIT_HEIGHT,
    orbitRadius * Math.cos(orbitAngle)
  );
  camera.lookAt(0, LOOK_AT_Y, 0);

  updateTravelers();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
