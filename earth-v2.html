<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urth V2 – Vertex Earth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0F4C8A; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Texture CDN ───────────────────────────────────────────────────────────────
const T4 = 'https://raw.githubusercontent.com/turban/webgl-earth/master/images/';

// ── Renderer — alpha:true lets the white CSS background show through ──────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);   // fully transparent clear
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ── Scene & Camera ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 2.6;

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.05;
controls.minDistance     = 1.8;
controls.maxDistance     = 12;

// ── Textures ──────────────────────────────────────────────────────────────────
const loader   = new THREE.TextureLoader();
const colorMap = loader.load(T4 + '2_no_clouds_4k.jpg');  // 4k day surface
const elevMap  = loader.load(T4 + 'elev_bump_4k.jpg');    // 4k elevation
const waterMap = loader.load(T4 + 'water_4k.png');        // water mask: 1=ocean, 0=land

// ── Globe Group (axial tilt) ──────────────────────────────────────────────────
const globeGroup = new THREE.Group();
globeGroup.rotation.z = -23.4 * Math.PI / 180;
scene.add(globeGroup);

// ── 1. Wireframe Ghost Sphere ─────────────────────────────────────────────────
// Low-detail icosahedron — subtle dark lattice, reads well on white
const ghostGeo = new THREE.IcosahedronGeometry(1, 16);
globeGroup.add(new THREE.Mesh(ghostGeo, new THREE.MeshBasicMaterial({
  color:       0xffffff,
  wireframe:   true,
  transparent: true,
  opacity:     0.06,
})));

// ── 2. Vertex Point Cloud ─────────────────────────────────────────────────────
// detail=120 → ~144 k vertices → one point per vertex
const pointsGeo = new THREE.IcosahedronGeometry(1, 120);

// ── Vertex Shader ─────────────────────────────────────────────────────────────
const vertexShader = /* glsl */`
  uniform float     uSize;
  uniform sampler2D uElevTex;

  varying vec2  vUv;
  varying float vVisible;
  varying float vElev;

  void main() {
    vUv = uv;

    vec4 mvPos    = modelViewMatrix * vec4(position, 1.0);
    vec3 mvNormal = normalMatrix * normal;

    // Discard back-facing points (facing away from camera)
    vVisible = step(0.0, dot(-normalize(mvPos.xyz), normalize(mvNormal)));

    // Elevation: push each point along view-Z proportional to terrain height
    float elv = texture2D(uElevTex, uv).r;
    vElev      = elv;
    mvPos.z   += 0.35 * elv;

    // Point size scales slightly with elevation for mountain peaks
    gl_PointSize = uSize * (1.0 + elv * 0.6);
    gl_Position  = projectionMatrix * mvPos;
  }
`;

// ── Fragment Shader ───────────────────────────────────────────────────────────
const fragmentShader = /* glsl */`
  uniform sampler2D uColorTex;
  uniform sampler2D uWaterTex;

  varying vec2  vUv;
  varying float vVisible;
  varying float vElev;

  void main() {
    // Discard back-facing vertices (set in vertex shader)
    if (floor(vVisible + 0.1) == 0.0) discard;

    // Round point shape (discard corners of gl_PointCoord square)
    vec2 cxy   = 2.0 * gl_PointCoord - 1.0;
    float r    = dot(cxy, cxy);
    if (r > 1.0) discard;

    // Alpha: ocean (water=1) → transparent, land (water=0) → opaque
    float water = texture2D(uWaterTex, vUv).r;
    float alpha  = 1.0 - water;

    vec3 color = texture2D(uColorTex, vUv).rgb;

    gl_FragColor = vec4(color, alpha);
  }
`;

const uniforms = {
  uSize:     { value: 4.0 },
  uColorTex: { value: colorMap },
  uElevTex:  { value: elevMap  },
  uWaterTex: { value: waterMap },
};

const pointsMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite:  false,
});

globeGroup.add(new THREE.Points(pointsGeo, pointsMat));

// ── 3. Traveling Particles with Light Trails ─────────────────────────────────
const N_TRAVELERS = 18;
const TRAIL_LEN   = 400;
const DPR         = window.devicePixelRatio;
const HEAD_SZ     = 6.5 * DPR;
const TRAIL_SZ    = 3.0 * DPR;

function randOnSphere() {
  const theta = 2 * Math.PI * Math.random();
  const phi   = Math.acos(2 * Math.random() - 1);
  return new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.sin(phi) * Math.sin(theta),
    Math.cos(phi)
  );
}
function randTangent(pos) {
  const up = Math.abs(pos.y) < 0.9
    ? new THREE.Vector3(0, 1, 0)
    : new THREE.Vector3(1, 0, 0);
  return new THREE.Vector3().crossVectors(pos, up).normalize();
}

// Each traveler: position on unit sphere, tangent direction, speed, trail history
const travelers = Array.from({ length: N_TRAVELERS }, () => {
  const pos = randOnSphere();
  return { pos, dir: randTangent(pos), speed: 0.003 + Math.random() * 0.003, trail: [] };
});

// Pre-allocated typed arrays — zero heap pressure per frame
const totalPts   = N_TRAVELERS * TRAIL_LEN;
const tPositions = new Float32Array(totalPts * 3);
const tAlphas    = new Float32Array(totalPts);
const tSizes     = new Float32Array(totalPts);

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position',
  new THREE.BufferAttribute(tPositions, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('aAlpha',
  new THREE.BufferAttribute(tAlphas,    1).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('aSize',
  new THREE.BufferAttribute(tSizes,     1).setUsage(THREE.DynamicDrawUsage));

const travelVS = /* glsl */`
  attribute float aAlpha;
  attribute float aSize;
  varying float   vAlpha;
  void main() {
    vAlpha       = aAlpha;
    vec4 mvPos   = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize;
    gl_Position  = projectionMatrix * mvPos;
  }
`;

const travelFS = /* glsl */`
  uniform vec3  uColor;
  varying float vAlpha;
  void main() {
    vec2  cxy  = 2.0 * gl_PointCoord - 1.0;
    float r    = dot(cxy, cxy);
    if (r > 1.0) discard;
    // Tight bright core with a softer secondary ring for luminosity
    float glow = exp(-r * 2.8) + exp(-r * 8.0) * 0.6;
    gl_FragColor = vec4(uColor, vAlpha * glow);
  }
`;

const trailMat = new THREE.ShaderMaterial({
  uniforms:       { uColor: { value: new THREE.Color(0xc8e6ff) } },
  vertexShader:   travelVS,
  fragmentShader: travelFS,
  transparent:    true,
  depthWrite:     false,
});

const trailMesh = new THREE.Points(trailGeo, trailMat);
trailMesh.renderOrder = 2;   // always on top of the point cloud
globeGroup.add(trailMesh);

// ── Glow halo — same geometry, wider Gaussian, renders behind the core ────────
const glowVS = /* glsl */`
  attribute float aAlpha;
  attribute float aSize;
  varying float   vAlpha;
  void main() {
    vAlpha       = aAlpha;
    vec4 mvPos   = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * 3.5;   // bloom radius: 3.5× the core point size
    gl_Position  = projectionMatrix * mvPos;
  }
`;
const glowFS = /* glsl */`
  uniform vec3  uColor;
  varying float vAlpha;
  void main() {
    vec2  cxy  = 2.0 * gl_PointCoord - 1.0;
    float r    = dot(cxy, cxy);
    if (r > 1.0) discard;
    // Very wide, very soft — creates a bloom halo around the core
    float halo   = exp(-r * 1.1);
    gl_FragColor = vec4(uColor, vAlpha * halo * 0.16);
  }
`;
const glowMat = new THREE.ShaderMaterial({
  uniforms:       { uColor: { value: new THREE.Color(0x88bbff) } }, // lighter tint
  vertexShader:   glowVS,
  fragmentShader: glowFS,
  transparent:    true,
  depthWrite:     false,
});
const glowMesh = new THREE.Points(trailGeo, glowMat); // shares the same buffer
glowMesh.renderOrder = 1;   // drawn before the core (renderOrder 2)
globeGroup.add(glowMesh);

// Reusable scratch vector (avoids allocations in the hot loop)
const _perp = new THREE.Vector3();

function updateTravelers() {
  travelers.forEach((t, ti) => {
    // ── Move: Euler step on sphere then renormalize ──
    const newPos = t.pos.clone().addScaledVector(t.dir, t.speed).normalize();

    // ── Parallel-transport direction onto the new tangent plane ──
    const newDir = t.dir.clone()
      .addScaledVector(newPos, -t.dir.dot(newPos))
      .normalize();

    // ── Random steering: tiny perpendicular nudge each frame ──
    _perp.crossVectors(newPos, newDir);
    newDir.addScaledVector(_perp, (Math.random() - 0.5) * 0.024).normalize();
    newDir.addScaledVector(newPos, -newDir.dot(newPos)).normalize(); // re-project

    t.pos = newPos;
    t.dir = newDir;
    t.trail.unshift(newPos.clone());
    if (t.trail.length > TRAIL_LEN) t.trail.pop();

    // ── Write into pre-allocated typed arrays ──
    const base = ti * TRAIL_LEN;
    for (let i = 0; i < TRAIL_LEN; i++) {
      const bi = (base + i) * 3;
      if (i < t.trail.length) {
        const p  = t.trail[i];
        tPositions[bi]     = p.x;
        tPositions[bi + 1] = p.y;
        tPositions[bi + 2] = p.z;
        const frac         = 1.0 - i / t.trail.length;
        tAlphas[base + i]  = frac * frac;                           // quadratic fade
        tSizes [base + i]  = i === 0 ? HEAD_SZ : TRAIL_SZ * frac;  // head biggest
      } else {
        tAlphas[base + i] = 0;
        tSizes [base + i] = 0;
      }
    }
  });

  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate   = true;
  trailGeo.attributes.aSize.needsUpdate    = true;
}

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  globeGroup.rotation.y += 0.0015;
  updateTravelers();
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
