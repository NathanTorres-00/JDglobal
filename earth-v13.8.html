<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urth V13.8 – Flat Brick Scroll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── Config ────────────────────────────────────────────────────────────────────
const CARD_W        = 276;
const CARD_H        = 154;
const CARD_GAP      = 24;
const ROW_GAP       = 24;
const CARD_PITCH    = CARD_W + CARD_GAP;   // 300
const ROW_PITCH     = CARD_H + ROW_GAP;    // 178
const EQUATOR_GAP   = 135;
const NUM_ROWS      = 4;
const CARDS_PER_ROW = 22;
const BASE_SPEED    = 113;
const TOTAL_WIDTH   = CARDS_PER_ROW * CARD_PITCH; // wrap period

// Row 0 = closest to equator (fastest), row 3 = furthest (slowest)
// Alternating directions: even rows left, odd rows right
const ROW_CONFIG = [
  { speedMult: 1.00, dir: -1 },
  { speedMult: 0.76, dir: +1 },
  { speedMult: 0.54, dir: -1 },
  { speedMult: 0.36, dir: +1 },
];

const IMAGES = [
  '/images/house-church-1.jpg',
  '/images/house-church-2.jpg',
  '/images/house-church-3.jpg',
  '/images/house-church-4.jpg',
  '/images/house-church.jpg',
  '/images/baptism-1.jpg',
  '/images/dr-lin-baptism.png',
  '/images/imags-archive-3.png',
  '/images/nano-baptism.png',
  '/images/image-14-1.jpeg',
];
const TOTAL_SLOTS = 20;
const ATLAS_COLS = 5, ATLAS_ROWS = 4, IMG_W = 320, IMG_H = 180;

// ── Atlas ─────────────────────────────────────────────────────────────────────
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width  = ATLAS_COLS * IMG_W;
atlasCanvas.height = ATLAS_ROWS * IMG_H;
const atx = atlasCanvas.getContext('2d');
atx.fillStyle = '#111';
atx.fillRect(0, 0, atlasCanvas.width, atlasCanvas.height);

const atlas = new THREE.CanvasTexture(atlasCanvas);
atlas.colorSpace = THREE.SRGBColorSpace;
atlas.flipY = false;

function drawCover(ctx, img, dx, dy, dw, dh) {
  const imgAspect = img.naturalWidth / img.naturalHeight;
  const dstAspect = dw / dh;
  let sx, sy, sw, sh;
  if (imgAspect > dstAspect) {
    sh = img.naturalHeight; sw = sh * dstAspect;
    sx = (img.naturalWidth - sw) / 2; sy = 0;
  } else {
    sw = img.naturalWidth; sh = sw / dstAspect;
    sx = 0; sy = (img.naturalHeight - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

for (let i = 0; i < TOTAL_SLOTS; i++) {
  const col = i % ATLAS_COLS, row = Math.floor(i / ATLAS_COLS);
  const img = new Image();
  img.onload = () => { drawCover(atx, img, col * IMG_W, row * IMG_H, IMG_W, IMG_H); atlas.needsUpdate = true; };
  img.src = IMAGES[i % IMAGES.length];
}

// ── Renderer / Scene / Camera ─────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 1, 6000);

function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  // Show ~5 cards across
  const targetHalfWidth = CARD_PITCH * 2.6;
  camera.position.z = targetHalfWidth / (Math.tan((camera.fov * Math.PI / 180) * 0.5) * camera.aspect);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
fitCamera();
window.addEventListener('resize', fitCamera);

// ── Card shader ───────────────────────────────────────────────────────────────
const cardVS = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const cardFS = `
  uniform sampler2D uAtlas;
  uniform float     uPhotoIdx;
  uniform float     uReady;
  varying vec2 vUv;
  const float COLS = 5.0;
  const float ROWS = 4.0;
  void main() {
    const float ASPECT = 16.0 / 9.0;
    vec2  p = vUv * 2.0 - 1.0;
    p.x *= ASPECT;
    float r = 0.20;
    vec2  q = abs(p) - vec2(ASPECT, 1.0) + r;
    float d = length(max(q, 0.0)) - r;
    float tol = 0.025;
    if (d > tol) discard;
    float edge = 1.0 - smoothstep(-tol, tol, d);

    float aCol = mod(uPhotoIdx, COLS);
    float aRow = floor(uPhotoIdx / COLS);
    vec2 uv = vec2(
      (aCol + vUv.x) / COLS,
      (aRow + (1.0 - vUv.y)) / ROWS
    );
    vec4 col = texture2D(uAtlas, uv);

    col.rgb = pow(col.rgb, vec3(0.55));
    col.rgb *= 1.15;
    col.rgb = clamp(col.rgb, 0.0, 1.0);

    float bw = 0.12;
    float border = step(-bw, d) * (1.0 - step(0.0, d));
    col.rgb = mix(col.rgb, vec3(0.90, 0.95, 1.0), border * 0.18);

    gl_FragColor = vec4(col.rgb, col.a * edge * uReady);
  }
`;

// ── Build rows ────────────────────────────────────────────────────────────────
// rowData holds per-row mesh list, initial X positions, and scroll speed.
// Animation uses elapsed time + modulo so only the card crossing the edge
// wraps (off-screen), eliminating the whole-row jump of group-level wrapping.
const rowData = [];
let photoIdx = 0;

for (let side = 0; side < 2; side++) {
  for (let i = 0; i < NUM_ROWS; i++) {
    const cfg      = ROW_CONFIG[i];
    const ySign    = side === 0 ? 1 : -1;
    const yCenter  = ySign * (EQUATOR_GAP + CARD_H * 0.5 + i * ROW_PITCH);
    const brickOff = ((side * NUM_ROWS + i) % 2 === 1) ? CARD_PITCH * 0.5 : 0;
    const speed    = cfg.speedMult * BASE_SPEED * cfg.dir;

    const group = new THREE.Group();
    group.position.y = yCenter;
    scene.add(group);

    const meshes    = [];
    const initialX  = [];

    for (let j = 0; j < CARDS_PER_ROW; j++) {
      // Store raw initial X (no centering yet — centering applied each frame)
      const x0 = j * CARD_PITCH + brickOff;
      initialX.push(x0);

      const uni = {
        uAtlas:    { value: atlas },
        uPhotoIdx: { value: photoIdx % TOTAL_SLOTS },
        uReady:    { value: 0.0 },
      };
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(CARD_W, CARD_H),
        new THREE.ShaderMaterial({
          uniforms: uni, vertexShader: cardVS, fragmentShader: cardFS,
          transparent: true, depthWrite: false,
        })
      );
      // Initial position
      mesh.position.x = x0 - TOTAL_WIDTH * 0.5;
      group.add(mesh);
      meshes.push(mesh);

      const fadeIn = () => {
        uni.uReady.value = Math.min(1.0, uni.uReady.value + 0.018);
        if (uni.uReady.value < 1.0) requestAnimationFrame(fadeIn);
      };
      fadeIn();

      photoIdx++;
    }

    rowData.push({ meshes, initialX, speed });
  }
}

// ── Animate ───────────────────────────────────────────────────────────────────
// Per-card modulo position: each card wraps individually when it exits the
// tile period, so only one card teleports at a time (off-screen) — no jumps.
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  rowData.forEach(({ meshes, initialX, speed }) => {
    const offset = t * speed;
    meshes.forEach((mesh, j) => {
      const raw     = initialX[j] + offset;
      // JS % can return negative — double modulo ensures positive result
      const wrapped = ((raw % TOTAL_WIDTH) + TOTAL_WIDTH) % TOTAL_WIDTH;
      mesh.position.x = wrapped - TOTAL_WIDTH * 0.5;
    });
  });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
